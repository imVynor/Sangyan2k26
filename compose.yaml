services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sangyan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sangyan
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: sangyan_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sangyan -d sangyan_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sangyan-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10